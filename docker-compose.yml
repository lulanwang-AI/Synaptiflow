# One-command run: docker compose up
#   Mock (default, no key, no spend):  BOLTZ_MOCK=1 docker compose up --build
#   Live:  BOLTZ_API_KEY=sk-... BOLTZ_MAX_SPEND_USD=25 BOLTZ_MOCK=0 docker compose up --build
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      BOLTZ_MOCK: "${BOLTZ_MOCK:-1}"
      BOLTZ_API_KEY: "${BOLTZ_API_KEY:-}"
      BOLTZ_MAX_SPEND_USD: "${BOLTZ_MAX_SPEND_USD:-50}"
      # NVIDIA NIM tier (AlphaFold2 / MolMIM / DiffDock). Mock by default;
      # set NIM_MOCK=0 + NVIDIA_API_KEY for live NIM calls. BoltzMol stays the
      # default generator unless GENERATOR_ENGINE=molmim.
      NIM_MOCK: "${NIM_MOCK:-1}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      GENERATOR_ENGINE: "${GENERATOR_ENGINE:-boltz}"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: "http://localhost:8000"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173
