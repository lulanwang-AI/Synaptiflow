[project]
name = "closed-loop-mvp-backend"
version = "0.1.0"
description = "Closed-Loop Discovery MVP — backend (FastAPI + RDKit + Boltz wrapper)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "rdkit>=2023.9",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Live Boltz calls require the (new) SDK; pin once confirmed at api.boltz.bio/docs.
# boltz = ["boltz_api==<pinned-version>"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
