name: CI

# Tests and CI run with BOLTZ_MOCK=1 and never spend Boltz credits.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      BOLTZ_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: pip install -e "backend[dev]"
      - name: Pytest (mock mode, no spend)
        run: cd backend && pytest
      - name: End-to-end smoke loop (mock mode, no spend)
        run: cd backend && python smoke_loop.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        run: cd frontend && npm install
      - name: Type-check & build
        run: cd frontend && npm run build
